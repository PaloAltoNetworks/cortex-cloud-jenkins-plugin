<div>
  The container image to scan, given as a full reference
  (<code>repository:tag</code>), for example <code>myrepo/app:1.2.3</code>.
  The image must be available to the Docker daemon on the build agent.
  Environment variables are expanded, so values like
  <code>myrepo/app:${BUILD_NUMBER}</code> are supported.
</div>
